name: Combine Parts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify parts and combine
        run: |
          set -e
          mkdir -p "moscow-bus-thing/Build"
 
          if [[ -f "moscow-bus-thing/Build/35.data.br.000.part" && -f "moscow-bus-thing/Build/35.data.br.001.part" && -f "moscow-bus-thing/Build/35.data.br.002.part" && -f "moscow-bus-thing/Build/35.data.br.003.part" ]]; then
            echo "All pieces found. Combining..."
            cat "moscow-bus-thing/Build/35.data.br.000.part" "moscow-bus-thing/Build/35.data.br.001.part" "moscow-bus-thing/Build/35.data.br.002.part" "moscow-bus-thing/Build/35.data.br.003.part" > "moscow-bus-thing/Build/35.data.br"
            echo "Combined -> moscow-bus-thing/Build/35.data.br"
            ls -lh "moscow-bus-thing/Build/35.data.br"
          else
            echo "ERROR: Missing one or more pieces."
            exit 1
          fi

      - name: Commit and push combined file
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f -- "moscow-bus-thing/Build/35.data.br.000.part" "moscow-bus-thing/Build/35.data.br.001.part" "moscow-bus-thing/Build/35.data.br.002.part" "moscow-bus-thing/Build/35.data.br.003.part" || true
          git add "moscow-bus-thing/Build/35.data.br"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Combine parts into 35.data.br and remove pieces"
            git push
          fi
